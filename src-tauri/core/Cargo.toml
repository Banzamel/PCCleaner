[package]
name = "pccleaner-core"
version = "0.0.0"
edition = "2021"
publish = false
description = "PC Cleaner logic without any user interface: scanning, the plan data, cleaning, AI client, storage"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
wmi = "0.18"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Environment",
  "Win32_Globalization",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_Security_Authorization",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Services",
  "Win32_System_Restore",
  "Win32_System_TaskScheduler",
  "Win32_System_UpdateAgent",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell_Common",
  "Win32_Devices_DeviceAndDriverInstallation",
] }

[dev-dependencies]
tempfile = "3"
