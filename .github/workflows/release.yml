name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($tag -ne $v) { Write-Host "::error::Tag v$tag does not match version $v in package.json"; exit 1 }
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install dependencies
        run: npm ci

      - name: Type check and tests
        run: |
          npx tsc --noEmit
          npm test
          cd src-tauri
          cargo test -p pccleaner-core

      # Updater artifacts (.sig) only for releases: they need the signing key from the secrets
      - name: Build the installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            Set-Content -Path updater.json -Value '{"bundle":{"createUpdaterArtifacts":true}}'
            npx tauri build --config updater.json
          } else {
            npx tauri build
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Release names stay as before: the website and the self-updater of the PowerShell versions
      # (1.8.0 and older) look for PCCleaner-Setup-<version>.exe and PCCleaner-<version>-portable.zip
      - name: Collect release files
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $nsis = 'src-tauri\target\release\bundle\nsis'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$nsis\PC Cleaner_${v}_x64-setup.exe" "dist\PCCleaner-Setup-$v.exe"
          if (Test-Path "$nsis\PC Cleaner_${v}_x64-setup.exe.sig") {
            Copy-Item "$nsis\PC Cleaner_${v}_x64-setup.exe.sig" "dist\PCCleaner-Setup-$v.exe.sig"
          }
          $tmp = 'portable\PCCleaner'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Copy-Item src-tauri\target\release\PCCleaner.exe, README.md, LICENSE $tmp
          Compress-Archive -Path $tmp -DestinationPath "dist\PCCleaner-$v-portable.zip"

      - name: Release notes and latest.json
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $v = [version]'${{ steps.version.outputs.version }}'
          # Versions that were never released get their notes in this release too
          $prev = git tag --list 'v*' | ForEach-Object { [version]$_.TrimStart('v') } | Where-Object { $_ -lt $v } |
            Sort-Object -Descending | Select-Object -First 1
          $log = [IO.File]::ReadAllText('CHANGELOG.md')
          $sections = [regex]::Matches($log, "(?ms)^## (\d+\.\d+\.\d+)\b[^\r\n]*\r?\n(.*?)(?=^## |\z)") |
            Where-Object { $sv = [version]$_.Groups[1].Value; $sv -le $v -and (-not $prev -or $sv -gt $prev) }
          if (-not ($sections | Where-Object { [version]$_.Groups[1].Value -eq $v })) { Write-Host "::error::CHANGELOG.md has no section for $v"; exit 1 }
          if (@($sections).Count -eq 1) { $notes = @($sections)[0].Groups[2].Value.Trim() }
          else { $notes = (@($sections) | ForEach-Object { $_.Value.Trim() }) -join "`n`n" }
          [IO.File]::WriteAllText("$pwd\release-notes.md", $notes)
          # latest.json for the Tauri updater; the url points at the renamed setup (the signature
          # covers the file content, not its name)
          $sig = (Get-Content "dist\PCCleaner-Setup-$v.exe.sig" -Raw).Trim()
          $latest = [ordered]@{
            version   = "$v"
            notes     = $notes
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{ 'windows-x86_64' = @{ signature = $sig; url = "https://github.com/Banzamel/PCCleaner/releases/download/v$v/PCCleaner-Setup-$v.exe" } }
          }
          [IO.File]::WriteAllText("$pwd\dist\latest.json", ($latest | ConvertTo-Json -Depth 5))
          Get-ChildItem dist | ForEach-Object { "{0}  {1:N0} KB" -f $_.Name, ($_.Length / 1KB) }

      - uses: actions/upload-artifact@v4
        with:
          name: PCCleaner-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: PC Cleaner ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: dist/*
